		<script>
		function isPlaying(audio) {

		}
		const audio = new Audio("images/QuestMaster.mp3");

  <h1 id="siteTitle"></h1>
  <h3 id="subtitle"></h3>
<hr id="miniline">
  <p id="latest"></p>
  <p id="updated"></p>
<hr id="miniline">
  <div id="posts"></div>

  <script>
    async function loadData() {
      const res = await fetch("data.json");
      const data = await res.json();

      document.getElementById("siteTitle").innerText = data.siteTitle;
      document.getElementById("subtitle").innerText = data.subtitle;
      document.getElementById("latest").innerText = "Latest Update: " + data.latestUpdate;
      document.getElementById("updated").innerText = "Last Updated: " + data.lastUpdated;

      const postsDiv = document.getElementById("posts");
      postsDiv.innerHTML = data.posts.map(post => `
        <div class="post">
          ${post.image ? `<img src="${post.image}" alt="${post.title}" width="80%" height="auto">` : ""}
          <h2 class="post-title">${post.title}</h2>
          <div class="post-date">${post.date}</div>
          <p>${post.content}</p>
        </div>
      `).join("");
    }

    loadData();
  </script>
