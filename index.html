<!DOCTYPE html>
<html>
<head>
  <title>Soul's Remnant</title>
</head>
<body style="color:white; background:black; font-family:sans-serif;">
  <h1 id="title"></h1>
<h3 id="subtitle"></h3>

<p id="latest"></p>
<p id="updated"></p>

<div id="chapters"></div>

<script>
async function loadData() {
  const res = await fetch("data.json");
  const data = await res.json();

  document.getElementById("title").innerText = data.siteTitle;
  document.getElementById("subtitle").innerText = data.subtitle;

  document.getElementById("latest").innerText = "Latest Update: " + data.latestUpdate;
  document.getElementById("updated").innerText = "Last Updated: " + data.lastUpdated;

  document.getElementById("chapters").innerHTML =
    data.chapters.map(ch => `
      <div>
        <h2>${ch.title}</h2>
        <p>${ch.description}</p>
        <small>Released: ${ch.releaseDate}</small>
      </div>
    `).join("");
}

loadData();
</script>

</body>
</html>
