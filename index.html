<!DOCTYPE html>
<html>
<head>
  <title>Soul's Remnant</title>
</head>
<body style="color:white; background:black; font-family:sans-serif;">
  <h1>Soul's Remnant</h1>
  <div id="content"></div>

  <script>
    async function loadData() {
      const res = await fetch("data.json");
      const data = await res.json();
      document.getElementById("content").innerText = data.latestUpdate;
    }

    loadData();
  </script>
</body>
</html>
